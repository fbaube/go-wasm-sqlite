[package]
name = "wasi_sql_demo_host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
wasmtime = { version = "50", features = ["component-model", "async"] }
wasmtime-wasi = "48"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
